services:

  backend:

    build: .

    container_name: keviseals_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    stdin_open: true
    tty: true

  postgres:

    image: postgis/postgis:16-3.4

    container_name: keviseals_postgres

    restart: always

    environment:
      POSTGRES_DB: keviseals_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7-alpine

    container_name: keviseals_redis

    restart: always

    ports:
      - "6379:6379"

  pgadmin:

    image: dpage/pgadmin4

    container_name: keviseals_pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@keviseals.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:

  postgres_data: